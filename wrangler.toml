name = "fast"
main = "index.js"
no_bundle = true
base_dir = "."
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
routes = [{ pattern = "fast.thanejoss.com", custom_domain = true }]

[version_metadata]
binding = "CF_VERSION_METADATA"

[build]
command = "npm run build"
watch_dir = ["README.md", "home/template.html", "scripts/render-home.js"]

[[rules]]
type = "ESModule"
globs = ["index.js", "proxy.js", "home.js", "access.js", "admin.js", "hosts/*"]
fallthrough = false

[[rules]]
type = "Text"
globs = ["setup.sh", "home/index.html", "admin/*.html", "admin/*.css", "admin/app.js"]
fallthrough = false

# The Worker has no Wasm modules; do not upload Wasm files from development dependencies.
[[rules]]
type = "CompiledWasm"
globs = []
fallthrough = false

[[d1_databases]]
binding = "DB"
database_name = "fast-access"
database_id = "594214c2-dbbb-47a3-83d3-45d2c74d5294"
migrations_dir = "migrations"

[observability]
enabled = false

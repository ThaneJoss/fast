name = "fast"
main = "index.js"
no_bundle = true
base_dir = "."
compatibility_date = "2026-09-20"
workers_dev = false
preview_urls = false
routes = [{ pattern = "fast.thanejoss.com", custom_domain = true }]

[version_metadata]
binding = "CF_VERSION_METADATA"

[[rules]]
type = "ESModule"
globs = ["hosts/*"]
fallthrough = false

[[rules]]
type = "Text"
globs = ["setup.sh"]
fallthrough = false

[observability]
enabled = false

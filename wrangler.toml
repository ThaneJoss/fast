name = "fast"
main = "src/index.js"
no_bundle = true
base_dir = "."
compatibility_date = "2026-09-20"
workers_dev = false
preview_urls = false
routes = [{ pattern = "fast.thanejoss.com", custom_domain = true }]

[[rules]]
type = "ESModule"
globs = ["src/**/*.js", "hosts/*"]
fallthrough = false

[observability]
enabled = false

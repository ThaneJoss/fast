<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="fast 使用文档：Cloudflare Worker 白名单反向代理，一次配置 Ubuntu 与 npm 源。">
  <title>fast · 使用文档</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      color: #182230;
      background: #f6f7f9;
      --brand: #2563eb;
      --muted: #526075;
      --border: #e2e6ec;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html { scrollbar-gutter: stable; scroll-padding-top: 28px; }
    body { margin: 0; min-width: 320px; line-height: 1.8; -webkit-font-smoothing: antialiased; }
    a { color: #1d4ed8; text-underline-offset: .2em; }
    a:hover { text-decoration-thickness: 2px; }
    :where(a, summary, [tabindex]):focus-visible { outline: 3px solid var(--brand); outline-offset: 4px; border-radius: 3px; }
    .wrap { width: min(100%, 1240px); margin-inline: auto; padding-inline: 40px; }
    .site-header { background: #fff; border-bottom: 1px solid var(--border); }
    .header-inner { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 76px; }
    .brand { display: inline-flex; align-items: center; gap: 11px; color: #182230; text-decoration: none; white-space: nowrap; }
    .brand-name { font-size: 18px; font-weight: 650; letter-spacing: -.03em; }
    .brand-detail { margin-left: 7px; color: var(--muted); font-size: 13px; font-weight: 400; letter-spacing: 0; }
    .app-mark { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 10px; background: var(--brand); }
    .header-nav { display: flex; align-items: center; gap: 12px; }
    .header-nav a { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 7px 13px; border: 1px solid transparent; border-radius: 8px; color: var(--muted); font-size: 13px; font-weight: 500; text-decoration: none; }
    .header-nav .admin-link { color: #1d4ed8; border-color: #cbd5e1; }
    .header-nav a:hover { color: #1d4ed8; background: #eff4ff; border-color: #bfd2fc; }
    .page-label { margin: 32px 0 18px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .15em; }
    .document-layout { display: grid; grid-template-columns: minmax(0, 1fr) 220px; align-items: start; gap: 36px; }
    .document { grid-column: 1; grid-row: 1; min-width: 0; padding: 38px 42px 44px; background: #fff; border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 1px 3px rgb(16 24 40 / 4%); overflow-wrap: anywhere; }
    .document > :first-child { margin-top: 0; }
    .document > :last-child { margin-bottom: 0; }
    .document h1, .document h2, .document h3, .document h4, .document h5, .document h6 { color: #182230; font-weight: 650; line-height: 1.4; scroll-margin-top: 28px; }
    .document h1 { margin: 0 0 16px; font-size: clamp(2.5rem, 5vw, 3.25rem); letter-spacing: -.055em; }
    .document h1 + p { margin-top: 0; color: var(--muted); font-size: 18px; line-height: 1.75; }
    .document h2 { margin: 44px 0 18px; padding-bottom: 12px; border-bottom: 1px solid var(--border); font-size: 24px; letter-spacing: -.025em; }
    .document h3 { margin: 30px 0 12px; font-size: 19px; }
    .document h4, .document h5, .document h6 { margin: 24px 0 12px; font-size: 16px; }
    .document p, .document ul, .document ol, .document blockquote, .document table, .document pre { margin: 18px 0; }
    .document p, .document li { font-size: 15px; }
    .document ul, .document ol { padding-left: 1.5em; }
    .document li { padding-left: .2em; }
    .document li + li { margin-top: 9px; }
    .document li::marker { color: #6c7c94; }
    .document li > ul, .document li > ol { margin: 8px 0; }
    .document strong { font-weight: 650; }
    .document code, .document pre { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; font-size: .86em; }
    .document :not(pre) > code { padding: .16em .36em; border: 1px solid #e5eaf1; border-radius: 5px; color: #264771; background: #f4f6fa; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
    .document pre { max-width: 100%; padding: 19px 21px; border: 1px solid #253550; border-radius: 10px; background: #152238; color: #e7eefb; overflow-x: auto; line-height: 1.85; tab-size: 2; }
    .document pre code { padding: 0; border: 0; background: transparent; color: inherit; font-size: 13px; overflow-wrap: normal; word-break: normal; white-space: pre; }
    .document blockquote { padding: 2px 20px; border-left: 3px solid #9bbcf9; background: #f3f7ff; color: var(--muted); }
    .document blockquote > :first-child { margin-top: 12px; }
    .document blockquote > :last-child { margin-bottom: 12px; }
    .document table { display: block; max-width: 100%; border-collapse: collapse; overflow-x: auto; font-size: 14px; }
    .document th, .document td { padding: 10px 14px; border: 1px solid var(--border); text-align: left; }
    .document th { background: #f4f6fa; font-weight: 600; }
    .document tr:nth-child(even) { background: #fafbfc; }
    .document img { max-width: 100%; height: auto; border-radius: 8px; }
    .document hr { margin: 32px 0; border: 0; border-top: 1px solid var(--border); }
    .document input[type="checkbox"] { accent-color: var(--brand); }
    .document details { padding: 12px 16px; margin: 18px 0; border: 1px solid var(--border); border-radius: 8px; }
    .document summary { cursor: pointer; font-weight: 600; }
    .document kbd { padding: 2px 5px; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; font-family: inherit; font-size: .85em; }
    .toc { grid-column: 2; grid-row: 1; position: sticky; top: 28px; max-height: calc(100dvh - 56px); overflow-y: auto; padding-block: 16px; }
    .toc-label { margin: 0 0 16px; color: #182230; font-size: 12px; font-weight: 650; letter-spacing: .06em; }
    .toc nav { border-left: 1px solid #dce2ea; }
    .toc ul, .toc ol { list-style: none; margin: 0; padding: 0; }
    .toc li { margin: 0; }
    .toc a { display: block; padding: 8px 0 8px 16px; border-left: 2px solid transparent; margin-left: -1px; color: var(--muted); font-size: 13px; line-height: 1.6; overflow-wrap: anywhere; text-decoration: none; }
    .toc a:hover, .toc a:focus-visible { color: #1d4ed8; border-left-color: var(--brand); background: #eff4ff; }
    .toc ul ul a, .toc ol ol a, .toc .toc-h3 a { padding-left: 28px; font-size: 12px; }
    .site-footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 26px 36px; color: var(--muted); font-size: 12px; }
    .site-footer a { color: inherit; text-decoration: none; }
    .site-footer a:hover { color: #1d4ed8; }
    .skip-link { position: fixed; z-index: 10; top: 12px; left: 12px; padding: 10px 16px; border-radius: 8px; background: #182230; color: #fff; transform: translateY(-180%); }
    .skip-link:focus-visible { transform: translateY(0); }
    @media (max-width: 960px) {
      .wrap { padding-inline: 28px; }
      .document-layout { grid-template-columns: minmax(0, 1fr) 185px; gap: 24px; }
      .document { padding: 30px; }
    }
    @media (max-width: 760px) {
      .document-layout { display: flex; flex-direction: column; gap: 22px; }
      .toc { position: static; width: 100%; max-height: none; padding: 0; }
      .toc-label { margin-bottom: 10px; }
      .toc nav { border: 0; }
      .toc nav > ul, .toc nav > ol { display: flex; flex-wrap: wrap; gap: 7px; }
      .toc a { margin: 0; padding: 7px 11px; border: 1px solid var(--border); border-radius: 7px; background: #fff; font-size: 12px; }
      .toc a:hover, .toc a:focus-visible { border-color: #bfd2fc; }
      .toc ul ul, .toc ol ol { margin-top: 7px; }
      .document { width: 100%; }
    }
    @media (max-width: 480px) {
      .wrap { padding-inline: 18px; }
      .header-inner { flex-wrap: wrap; gap: 8px; padding-block: 16px 12px; }
      .header-nav { width: 100%; gap: 6px; }
      .header-nav a { min-height: 40px; padding-inline: 11px; }
      .page-label { margin-top: 24px; }
      .document { padding: 24px 20px 28px; border-radius: 12px; }
      .document h1 + p { font-size: 16px; }
      .document h2 { margin-top: 36px; font-size: 21px; }
      .document p, .document li { font-size: 14px; }
      .document pre { padding: 15px; }
      .document pre code { font-size: 12px; }
      .site-footer { padding-block: 22px 28px; }
    }
    @media print {
      body { background: #fff; }
      .wrap { width: 100%; padding: 0; }
      .site-header, .page-label, .toc, .site-footer, .skip-link { display: none; }
      .document-layout { display: block; }
      .document { border: 0; box-shadow: none; padding: 0; }
      .document h2, .document h3 { break-after: avoid; }
      .document pre { white-space: pre-wrap; border-color: var(--border); background: #f4f6fa; color: #182230; }
      .document pre code { white-space: pre-wrap; overflow-wrap: anywhere; }
    }
  </style>
</head>
<body id="top">
  <a class="skip-link" href="#main">跳到文档正文</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="/" aria-label="fast 使用文档首页">
        <span class="app-mark" aria-hidden="true"><svg viewBox="0 0 44 44" width="28" height="28"><path d="M12 12.5H23.5L18.5 20.5H12V12.5Z" fill="white"/><path d="M20.5 23.5H32V31.5H20.5L25.5 23.5Z" fill="white" opacity=".92"/><path d="M23 12.5H32L21 31.5H12L23 12.5Z" fill="none" stroke="white" stroke-width="2.6" stroke-linejoin="round"/></svg></span>
        <span class="brand-name">fast <span class="brand-detail">/ 使用文档</span></span>
      </a>
      <nav class="header-nav" aria-label="站点导航">
        <a href="/?format=script">查看初始化脚本</a>
        <a class="admin-link" href="/admin">访问管理 <span aria-hidden="true">&nbsp;↗</span></a>
      </nav>
    </div>
  </header>
  <div class="wrap">
    <p class="page-label">FAST / DOCUMENTATION</p>
    <div class="document-layout">
      <aside class="toc" aria-labelledby="toc-label">
        <p class="toc-label" id="toc-label">本页目录</p>
        <nav aria-label="文档目录">{{TOC}}</nav>
      </aside>
      <main class="document" id="main" tabindex="-1">{{CONTENT}}</main>
    </div>
    <footer class="site-footer"><span>fast / 使用文档</span><a href="#top">返回顶部 <span aria-hidden="true">↑</span></a></footer>
  </div>
</body>
</html>
